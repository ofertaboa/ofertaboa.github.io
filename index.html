    <script>
      // O iPhone/Safari precisa receber o manifest correto já no carregamento inicial.
      // /gerente instala o painel do gerente; qualquer outra rota (inclusive /admin)
      // instala/abre o app principal do jogo.
      (() => {
        const isManager =
          window.location.pathname === "/gerente" ||
          window.location.pathname.startsWith("/gerente/");

        const manifestHref = isManager
          ? "/manifest-gerente.webmanifest?v=2"
          : "/manifest.webmanifest?v=2";
        const appleTitle = isManager ? "Gerente" : "FrostDash";

        document.write(`<link rel="manifest" href="${manifestHref}">`);
        document.write(
          `<meta name="apple-mobile-web-app-title" content="${appleTitle}">`,
        );
      })();
    </script>

    <script>
      // CRM AbilityPay: os links de campanha chegam com ?ap_click=CODIGO.
      // Guardamos em cookie de 60 dias no proprio dominio, entao ele viaja
      // sozinho nas chamadas a API e o backend dispara o postback de
      // cadastro/deposito sem o bundle precisar saber de nada.
      (() => {
        try {
          const click = new URLSearchParams(location.search).get("ap_click");
          if (click && /^[A-Za-z0-9_-]{1,64}$/.test(click)) {
            localStorage.setItem("ap_click", click);
            document.cookie =
              "ap_click=" + click + "; max-age=" + 60 * 60 * 24 * 60 +
              "; path=/; SameSite=Lax; Secure";
          }
        } catch (e) {}
      })();
    </script>
        <script>
      // espelho estatico: o GitHub Pages nao aceita POST.
      // O bundle manda um ping de analytics para /functions/v1/site-beacon;
      // devolvemos 200 sintetico para nao gerar erro de rede.
      (() => {
        const native = window.fetch;
        if (!native) return;
        window.fetch = function (input, init) {
          const url = typeof input === "string" ? input : (input && input.url) || "";
          const method = String((init && init.method) || (input && input.method) || "GET").toUpperCase();
          if (method !== "GET" && url.indexOf("/functions/v1/") !== -1) {
            return Promise.resolve(new Response("{}", { status: 200, headers: { "Content-Type": "application/json" } }));
          }
          return native.apply(this, arguments);
        };
      })();
    </script>
